plugins {
    id 'java'
}

group = 'com.flyaway.anvilboundless'
version = '1.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.84-stable'
}

tasks.jar {
    archiveBaseName.set("AnvilBoundless")
}
